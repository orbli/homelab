apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel-ingress-controller
  namespace: gitops
  labels:
    app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
    app.kubernetes.io/part-of: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "45"  # after the ingress namespace (30) and the Ingress objects in each app
spec:
  project: default

  # Upstream Helm chart (github.com/STRRL/cloudflare-tunnel-ingress-controller).
  # It watches Ingress objects with ingressClassName cloudflare-tunnel and writes
  # them to the tunnel's remote config + a proxied CNAME per host, so a lab app's
  # public hostname is one Ingress in that app's own kustomize folder.
  # Reuses the existing tunnel by name and runs its own cloudflared connector pods
  # (the legacy cloudflared-deployment app is retired in a follow-up PR).
  source:
    repoURL: https://helm.strrl.dev
    chart: cloudflare-tunnel-ingress-controller
    targetRevision: 0.1.0
    helm:
      releaseName: cloudflare-tunnel-ingress-controller
      valuesObject:
        cloudflare:
          # Secret is created out-of-band (not in git), see kubernetes/manifests/cloudflared-namespace/README.md
          secretRef:
            name: cloudflare-tunnel-ingress-controller
            apiTokenKey: api-token
            accountIDKey: account-id
            tunnelNameKey: tunnel-name
        # Origins are addressed as <svc>.<ns>.svc.<clusterDomain>; this cluster is not cluster.local.
        clusterDomain: home-hk1-cluster.orbb.li
        image:
          repository: ghcr.io/strrl/cloudflare-tunnel-ingress-controller  # multi-arch (arm64 for the Pi nodes)
          tag: "0.1.0"
        cloudflared:
          replicaCount: 2   # same as the legacy deployment

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # secret is out-of-band
    syncOptions:
    - CreateNamespace=false  # cloudflared-namespace app owns it
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
