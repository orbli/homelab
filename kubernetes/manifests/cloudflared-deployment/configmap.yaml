apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: ingress
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: ingress
data:
  config.yaml: |
    # Name of the tunnel you want to run
    tunnel: home-hk1-cluster-tunnel
    credentials-file: /etc/cloudflared/creds/credentials.json
    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    # Autoupdates applied in a k8s pod will be lost when the pod is removed or restarted, so
    # autoupdate doesn't make sense in Kubernetes. However, outside of Kubernetes, we strongly
    # recommend using autoupdate.
    no-autoupdate: true
    # The `ingress` block is the SOURCE OF TRUTH for the tunnel's public hostnames,
    # but not via this file at runtime: the tunnel is remotely managed, so
    # cloudflared ignores the block below and takes its rules from Cloudflare.
    # CI (.github/workflows/tunnel-sync.yml, dns/tunnel-ingress.py) pushes this
    # block to the Cloudflare API: plan on PRs, apply on master. Keep the
    # catch-all last. The matching DNS CNAME is a separate record in
    # dns/dnsconfig.js (CNAME("<app>-lab", TUNNEL_HK1, CF_PROXY_ON)).
    # In-cluster DNS suffix is home-hk1-cluster.orbb.li, not cluster.local.
    ingress:
    - hostname: keycloak-lab.orbb.li
      service: http://keycloak-service.iam.svc.home-hk1-cluster.orbb.li:8080
      originRequest:
        noTLSVerify: true
    - hostname: grafana-lab.orbb.li
      service: http://prometheus-grafana.observability.svc.home-hk1-cluster.orbb.li
    - hostname: remark42-lab.orbb.li
      service: http://remark42.default.svc.home-hk1-cluster.orbb.li
    - hostname: infra-lab.orbb.li
      service: http://infra-status.infra-status.svc.home-hk1-cluster.orbb.li
    - hostname: registry-lab.orbb.li
      service: http://authorship-registry.authorship-registry.svc.home-hk1-cluster.orbb.li:80
      originRequest:
        noTLSVerify: true
    - service: http_status:404