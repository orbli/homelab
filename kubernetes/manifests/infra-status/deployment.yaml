# infra-status: serves a sanitized live snapshot of the estate over HTTP.
# Reached publicly only via the cloudflared tunnel (outbound-only; the home
# network is never in the request path). See files/server.py for the privacy
# rule — only counts, pretty labels and aggregate metrics ever leave the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-status
  namespace: infra-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-status
  template:
    metadata:
      labels:
        app: infra-status
    spec:
      serviceAccountName: infra-status
      containers:
      - name: server
        image: python:3.12-slim
        # openssh-client is needed only for the best-effort QNAP tile (no HTTP
        # stats surface on the NAS). Installed at startup and ';'-chained so the
        # collector still runs if the install fails.
        command: ["sh", "-c", "apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq openssh-client >/dev/null 2>&1 || true; exec python3 /src/server.py"]
        env:
        # INTERVAL = per-source refresh + SSE push period (seconds). The knob.
        # Keep it well under ~100s (Cloudflare drops idle proxied streams).
        - {name: INTERVAL, value: "1"}
        - {name: PORT, value: "8080"}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts:
        - {name: src, mountPath: /src}
        - {name: qnap-key, mountPath: /keys/qnap, readOnly: true}
      volumes:
      - name: src
        configMap:
          name: infra-status-src
      # SSH key for the QNAP tile. Secret created out-of-band (Ansible-owned,
      # like grafana-oauth-client) — NOT in git.
      - name: qnap-key
        secret:
          secretName: qnap-ssh
          defaultMode: 0400
