          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((last_over_time(claude_code_token_usage{host_name=~\"$host\"}[$__range]) - (last_over_time(claude_code_token_usage{host_name=~\"$host\"}[$__range] offset $__range) and last_over_time(claude_code_token_usage{host_name=~\"$host\"}[$__range]))) or (last_over_time(claude_code_token_usage{host_name=~\"$host\"}[$__range]) * 1))",
              "instant": true,
