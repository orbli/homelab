# Grafana dashboard for Claude Code usage telemetry.
#
# Discovery: the kube-prometheus-stack grafana-sc-dashboard sidecar watches
# ConfigMaps labeled grafana_dashboard=1 in ALL namespaces and hot-loads the
# JSON — no Grafana restart, no sqlite state. Provisioned dashboards survive
# PV wipes (the 2026-07-10 cutover destroyed the previous UI-created one).
#
# Data source: Claude Code exports OTLP metrics (see ~/.claude/settings.json
# on the WSL box) to the Alloy OTLP receiver, which remote-writes them to
# Prometheus. NOTE: Alloy's prometheus exporter adds NO _total/unit suffixes,
# so metric names are the bare converted OTLP names (claude_code_cost_usage,
# claude_code_token_usage, ...). Resource attr host.name arrives as label
# host_name — the $host template variable filters on it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  claude-code-usage.json: |
    {
      "uid": "claude-code-usage",
      "title": "Claude Code Usage",
      "tags": ["claude-code", "telemetry"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
            "query": "label_values(claude_code_cost_usage, host_name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Cost",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_cost_usage{host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "id": 2, "type": "stat", "title": "Tokens",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_token_usage{host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "id": 3, "type": "stat", "title": "Sessions",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_session_count{host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "id": 4, "type": "stat", "title": "Active time",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_active_time_total{host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 1, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "text" } }, "overrides": [] }
        },
        {
          "id": 5, "type": "stat", "title": "Lines added",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_lines_of_code_count{type=\"added\",host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] }
        },
        {
          "id": 6, "type": "stat", "title": "Lines removed",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A", "instant": true, "range": false,
            "expr": "sum(increase(claude_code_lines_of_code_count{type=\"removed\",host_name=~\"$host\"}[$__range]))" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "graphMode": "area", "colorMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "noValue": "0",
            "color": { "mode": "fixed", "fixedColor": "red" } }, "overrides": [] }
        },
        {
          "id": 7, "type": "timeseries", "title": "Cost by model (USD/hour)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A",
            "expr": "sum by (model) (rate(claude_code_cost_usage{host_name=~\"$host\"}[$__rate_interval]) * 3600)",
            "legendFormat": "{{model}}" }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "min": 0,
            "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10,
              "showPoints": "never", "spanNulls": false } }, "overrides": [] }
        },
        {
          "id": 8, "type": "timeseries", "title": "Token throughput by type (tokens/s)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A",
            "expr": "sum by (type) (rate(claude_code_token_usage{host_name=~\"$host\"}[$__rate_interval]))",
            "legendFormat": "{{type}}" }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0,
            "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 40,
              "showPoints": "never", "spanNulls": false, "stacking": { "mode": "normal", "group": "A" } } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "input" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "output" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "cacheRead" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] },
              { "matcher": { "id": "byName", "options": "cacheCreation" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] }
            ] }
        },
        {
          "id": 9, "type": "timeseries", "title": "Lines of code changed",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [{ "refId": "A",
            "expr": "sum by (type) (increase(claude_code_lines_of_code_count{host_name=~\"$host\"}[$__interval]))",
            "legendFormat": "{{type}}" }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "fieldConfig": { "defaults": { "unit": "short",
            "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80,
              "showPoints": "never", "spanNulls": false } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "added" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "removed" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.transform", "value": "negative-Y" }
                ] }
            ] }
        },
        {
          "id": 10, "type": "timeseries", "title": "Activity (sessions / commits / PRs)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus-cluster" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(claude_code_session_count{host_name=~\"$host\"}[$__interval]))",
              "legendFormat": "Sessions" },
            { "refId": "B", "expr": "sum(increase(claude_code_commit_count{host_name=~\"$host\"}[$__interval]))",
              "legendFormat": "Commits" },
            { "refId": "C", "expr": "sum(increase(claude_code_pull_request_count{host_name=~\"$host\"}[$__interval]))",
              "legendFormat": "Pull requests" }
          ],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "decimals": 0,
            "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80,
              "showPoints": "never", "spanNulls": false } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Sessions" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "Commits" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
              { "matcher": { "id": "byName", "options": "Pull requests" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }] }
            ] }
        }
      ]
    }
