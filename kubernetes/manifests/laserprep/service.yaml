# Internal-only (ClusterIP). The cluster network is routed over the tailnet
# with split-DNS, so from any tailnet machine this is directly:
#   http://laserprep.laserprep.svc.home-hk1-cluster.orbb.li/
apiVersion: v1
kind: Service
metadata:
  name: laserprep
  namespace: laserprep
spec:
  selector:
    app: laserprep
  ports:
  - port: 80
    targetPort: 8080
