# laserprep: MCGT photo→laser line-art pipeline, internal-only web service.
# Deterministic tail (threshold/1-bit/SVG/contact-sheet) runs on-cluster;
# GPU stylization is proxied to the DGX Spark via the networking-egress
# ExternalName service (glm-spark1.networking). No public exposure.
# Same no-image pattern as infra-status: python:3.12-slim + deps at startup,
# source mounted from hash-suffixed ConfigMaps so edits roll the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laserprep
  namespace: laserprep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laserprep
  template:
    metadata:
      labels:
        app: laserprep
    spec:
      containers:
      - name: server
        image: python:3.12-slim
        # Thin portal: all image math happens in the browser (prep.js);
        # the full pipeline lives in the manual_xtool CLI.
        command: ["sh", "-c"]
        args:
        - |
          pip install --no-cache-dir -q fastapi uvicorn python-multipart
          exec python3 -m uvicorn server:app --host 0.0.0.0 --port 8080 --app-dir /app --workers 2
        env:
        # Phase 3 stylization endpoint on the Spark (imgedit container; the
        # app degrades to 503 on /stylize while the model is loading/absent).
        - {name: STYLIZE_UPSTREAM, value: "http://imgedit-spark1.networking:8001"}
        - {name: PYTHONPATH, value: "/app"}
        - {name: LASERPREP_CONFIG, value: "/app/configs/materials.toml"}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - {name: web-src, mountPath: /app}
        - {name: config, mountPath: /app/configs}
      volumes:
      - name: web-src
        configMap: {name: laserprep-web-src}
      - name: config
        configMap: {name: laserprep-config}
