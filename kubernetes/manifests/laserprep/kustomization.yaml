apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laserprep

resources:
- namespace.yaml
- service.yaml
- deployment.yaml
- stylize.yaml

# Source of truth for the package is ~/workbench/manual_xtool (copied here on
# change). Hash-suffixed ConfigMaps roll the Deployment on every edit.
configMapGenerator:
- name: laserprep-web-src
  files:
  - files/server.py
  - files/prep.js
  - files/index.js
- name: laserprep-stylize-src
  files:
  - files/stylize_server.py
- name: laserprep-config
  files:
  - files/materials.toml

labels:
- pairs:
    app.kubernetes.io/managed-by: argocd
  includeSelectors: false
