apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authorship-registry

resources:
- namespace.yaml
- postgres.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd

# DEMO ONLY (friend's authorship registry, source: github.com/orbli/authorship-registry).
# Fake data only; the production target is AWS (Lambda + Aurora DSQL, see that repo's infra/).
# Secrets are created out-of-band (not in git):
#   registry-db   password            generated once
#   registry-app  ADMIN_EMAIL SMTP_USERNAME SMTP_PASSWORD   Gmail app password for outbound mail
# Public hostname registry-lab.orbb.li: ingress.yaml (cloudflare-tunnel ingress class).
