apiVersion: apps/v1
kind: Deployment
metadata:
  name: remark42
  namespace: default
  labels:
    app.kubernetes.io/name: remark42
    app.kubernetes.io/part-of: comments
spec:
  # Bolt (the embedded KV store) takes an exclusive file lock on the PVC, so
  # there can only ever be one replica. Use Recreate so the new pod can grab
  # the lock as soon as the old one releases it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remark42
  template:
    metadata:
      labels:
        app: remark42
        app.kubernetes.io/name: remark42
        app.kubernetes.io/part-of: comments
    spec:
      securityContext:
        fsGroup: 1001
      containers:
      - name: remark42
        # Pinned to v1.16.0, the first numbered release to ship the custom OAuth2
        # provider (AUTH_CUSTOM_*, upstream #2006) we need to talk to Keycloak.
        # Until v1.16.0 we tracked `master` because v1.15.0 lacked that feature.
        # v1.16.0 also patches several security bugs (OAuth open-redirect, SSRF,
        # path traversal, stored XSS).
        # Bump deliberately: HEAD the registry manifest for the multi-arch index
        # digest (`docker buildx imagetools inspect umputun/remark42:vX.Y.Z`) and
        # paste it here.
        image: umputun/remark42:v1.16.0@sha256:b24ab1b8e0b5db650c44adc559c2ca24448baae7ca70c36fc2e7550130609e82
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: REMARK_URL
          value: "https://remark42-lab.orbb.li"
        - name: SITE
          value: "orbli"
        - name: STORE_BOLT_PATH
          value: "/srv/var/db"
        - name: BACKUP_PATH
          value: "/srv/var/backup"
        - name: ALLOWED_HOSTS
          value: "'self',https://orbb.li"
        - name: ADMIN_SHARED_EMAIL
          value: "mail@orbb.li"
        - name: AUTH_ANON
          value: "false"
        - name: AUTH_EMAIL_ENABLE
          value: "false"
        - name: AUTH_CUSTOM_NAME
          value: "keycloak"
        - name: AUTH_CUSTOM_AUTH_URL
          value: "https://keycloak-lab.orbb.li/realms/orbb.li/protocol/openid-connect/auth"
        - name: AUTH_CUSTOM_TOKEN_URL
          value: "https://keycloak-lab.orbb.li/realms/orbb.li/protocol/openid-connect/token"
        - name: AUTH_CUSTOM_INFO_URL
          value: "https://keycloak-lab.orbb.li/realms/orbb.li/protocol/openid-connect/userinfo"
        - name: AUTH_CUSTOM_SCOPES
          value: "openid,email,profile"
        - name: AUTH_CUSTOM_NAME_FIELD
          value: "preferred_username"
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: remark42-app-secret
              key: jwt-secret
        - name: ADMIN_PASSWD
          valueFrom:
            secretKeyRef:
              name: remark42-app-secret
              key: admin-passwd
        - name: AUTH_CUSTOM_CID
          valueFrom:
            secretKeyRef:
              name: remark42-oauth-client
              key: client-id
        - name: AUTH_CUSTOM_CSEC
          valueFrom:
            secretKeyRef:
              name: remark42-oauth-client
              key: client-secret
        volumeMounts:
        - name: data
          mountPath: /srv/var
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: remark42-data
