# In-cluster route for remark42-lab.orbb.li. Traffic arrives from Traefik (the tunnel's only
# origin; see kubernetes/manifests/cloudflared-namespace/public-hostnames/) and
# Traefik matches on Host to reach this Service.
#
# Named *-traefik rather than reusing the old object name on purpose: the old
# cloudflare-tunnel Ingress had to be deleted (not re-classed) so the tunnel
# controller would run its finalizer and drop its rule cleanly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remark42-traefik
spec:
  ingressClassName: traefik
  rules:
  - host: remark42-lab.orbb.li
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remark42
            port:
              number: 80
