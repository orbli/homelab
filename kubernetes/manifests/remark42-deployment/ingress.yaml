# Public hostname for this app. The cloudflare-tunnel ingress controller turns
# this into a tunnel rule + a proxied CNAME in orbb.li (DNSControl ignores
# *-lab CNAMEs, see dns/dnsconfig.js). Origin: http://remark42.<ns>.svc.home-hk1-cluster.orbb.li:80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remark42
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: remark42-lab.orbb.li
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remark42
            port:
              number: 80
