name: Sync Tailscale ACL

# Reusable core, not triggered directly. Called with mode=test by
# tailscale-acl-test.yml (pull_request) and mode=apply by
# tailscale-acl-apply.yml (push to master / manual). Split this way so
# the apply job never appears on a PR's checks list, not even as
# "skipped": GitHub lists every job of every workflow the pull_request
# event triggers, so a job-level `if:` only ever hides the run, not the
# check. Version pins and the gitops-pusher invocation live here once.
#
# The policy file is NOT in this repo. It lives in orbli/homelab-private
# (private), mounted here as the `private/` submodule, so the file this
# workflow applies is private/tailscale/acl.hujson. Pushes to the private
# repo open a PR here (its open-homelab-pr.yml) that bumps the pointer;
# merging that PR is the deploy. Checking out a private submodule needs
# a token that can read that repo: GH secret HOMELAB_PRIVATE_TOKEN (fine-
# grained PAT, Contents: read-only on orbli/homelab-private only). This
# repo is public, so run LOGS are public too: gitops-pusher prints etags
# and, on a rejected policy, the validator's error text. Secrets are
# masked.
#
# Installs the `gitops-pusher` binary from tailscale/tailscale (pinned
# to a specific Tailscale release tag) and runs it against the OAuth
# client whose credentials are in GH secrets TS_API_CLIENT_ID +
# TS_API_CLIENT_SECRET. Tailnet name comes from TS_TAILNET secret.
#
# Why pin the version: gitops-pusher's env-var names and behavior have
# changed across Tailscale releases (e.g. TS_API_CLIENT_* renamed to
# TS_OAUTH_*). Pinning ensures the workflow continues to work without
# manual fix-ups when Tailscale ships breaking changes upstream. Bump
# the tag periodically as part of routine maintenance.
#
# Why actions/cache: gitops-pusher stores the last-known control etag
# in version-cache.json so it can warn about manual edits made in the
# admin console between runs (with no cache it assumes control's
# current etag, so a fresh repo still applies fine). We restore the
# previous run's cache and save the updated one back. Cache key
# includes run_id (mandatory unique key on save) with a restore-key
# prefix that matches any prior cache, from either mode.
#
# Why pin Go too: `go install ...@TS_VERSION` compiles from source, so
# the toolchain must match what that Tailscale release targets. With
# go-version 'stable' the build broke when Go 1.27 shipped (v1.98.3's
# go-json-experiment dep fails with "undefined: json.SkipFunc"), which
# silently stopped ACL pushes from applying. Bump GO_VERSION together
# with TS_VERSION: it should match the `go` line in that tag's go.mod
# (https://proxy.golang.org/tailscale.com/@v/<tag>.mod).

on:
  workflow_call:
    inputs:
      mode:
        description: "'test' (dry run + drift detect) or 'apply' (push to live tailnet)"
        required: true
        type: string

env:
  TS_VERSION: v1.98.3
  GO_VERSION: '1.26'

jobs:
  gitops-pusher:
    name: gitops-pusher ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.HOMELAB_PRIVATE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore version-cache.json
        uses: actions/cache@v4
        with:
          path: ./version-cache.json
          key: ts-acl-cache-${{ github.run_id }}
          restore-keys: |
            ts-acl-cache-
      - name: Install gitops-pusher
        run: go install tailscale.com/cmd/gitops-pusher@${{ env.TS_VERSION }}
      - name: gitops-pusher ${{ inputs.mode }}
        env:
          # gitops-pusher env names (current): TS_OAUTH_ID + TS_OAUTH_SECRET.
          # GH secrets are stored with the older TS_API_CLIENT_* names from
          # an earlier version of the tool; remap here so the secret values
          # don't need to be rotated.
          TS_OAUTH_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
          TS_TAILNET: ${{ secrets.TS_TAILNET }}
        run: |
          case "${{ inputs.mode }}" in test|apply) ;; *) echo "::error::mode must be test or apply"; exit 1;; esac
          ~/go/bin/gitops-pusher \
            --policy-file=./private/tailscale/acl.hujson \
            --cache-file=./version-cache.json \
            "${{ inputs.mode }}"
